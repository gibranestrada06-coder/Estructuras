<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Asteriscos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-primary fw-bold">Generador de Asteriscos</h2>
                        <p class="text-muted small text-center">Ingresa un número entero positivo y el programa generará y mostrará en pantalla la misma cantidad de asteriscos.</p>
                        
                        <!-- Formulario de captura -->
                        <form id="formAsteriscos">
                            <div class="mb-4">
                                <label for="cantidadInput" class="form-label fw-semibold">Introduce un número:</label>
                                <input type="number" min="1" class="form-control" id="cantidadInput" placeholder="Ej. 15" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Generar Asteriscos</button>
                            </div>
                        </form>

                        <!-- Área de Resultados -->
                        <div id="resultadoAsteriscos" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión al archivo JavaScript externo -->
    <script src="../js/asteriscos.js"></script>
</body>
</html>
