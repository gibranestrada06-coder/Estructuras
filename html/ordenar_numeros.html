<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenar 3 Números de Mayor a Menor</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-primary fw-bold">Ordenar Números</h2>
                        <p class="text-muted small text-center">Ingresa tres números diferentes para organizarlos automáticamente de mayor a menor.</p>
                        
                        <!-- Formulario de captura -->
                        <form id="formOrdenar">
                            <div class="mb-3">
                                <label for="num1" class="form-label fw-semibold">Primer número:</label>
                                <input type="number" step="any" class="form-control" id="num1" placeholder="Ej. 15" required>
                            </div>

                            <div class="mb-3">
                                <label for="num2" class="form-label fw-semibold">Segundo número:</label>
                                <input type="number" step="any" class="form-control" id="num2" placeholder="Ej. 42" required>
                            </div>

                            <div class="mb-4">
                                <label for="num3" class="form-label fw-semibold">Tercer número:</label>
                                <input type="number" step="any" class="form-control" id="num3" placeholder="Ej. 7" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Ordenar de Mayor a Menor</button>
                            </div>
                        </form>

                        <!-- Área de Resultados -->
                        <div id="resultadoOrden" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/ordenar_numeros.js"></script>
</body>
</html>
