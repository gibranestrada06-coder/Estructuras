<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Importe Neto e Impuestos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-primary fw-bold">Cálculo de Importe Neto</h2>
                        <p class="text-muted small text-center">Ingresa el importe bruto. Si es mayor a 15,000 se aplicará un 16% de impuestos; en caso contrario, un 10%.</p>
                        
                        <!-- Formulario de captura -->
                        <form id="formImporte">
                            <div class="mb-4">
                                <label for="importeBruto" class="form-label fw-semibold">Importe Bruto ($):</label>
                                <input type="number" step="any" class="form-control" id="importeBruto" placeholder="Ej. 18000" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Calcular Importe Neto</button>
                            </div>
                        </form>

                        <!-- Área de Resultados -->
                        <div id="resultadoImporte" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión al archivo JavaScript externo -->
    <script src="../js/importe.js"></script>
</body>
</html>
