<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de Multiplicar (1 al 10)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="text-primary fw-bold">Tablas de Multiplicar del 1 al 10</h2>
            <p class="text-muted">Haz clic en el botón para generar de forma dinámica todas las tablas utilizando bucles anidados en JavaScript.</p>
            <button id="btnGenerar" class="btn btn-primary btn-lg rounded-pill shadow">Generar Tablas</button>
        </div>

        <!-- Contenedor donde se mostrarán las tarjetas con las tablas -->
        <div id="contenedorTablas" class="row g-4"></div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión al archivo JavaScript externo -->
    <script src="../js/tabla_ultiplicar.js"></script>
</body>
</html>
