<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Sueldo por Antigüedad</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 text-primary fw-bold">Sueldo por Antigüedad</h2>
                        <p class="text-muted small text-center">Sueldo base fijo: <strong>40,000 € anuales</strong>. Ingresa los años de servicio del trabajador para calcular su aumento y sueldo final.</p>
                        
                        <!-- Formulario de captura -->
                        <form id="formSueldo">
                            <div class="mb-4">
                                <label for="aniosServicio" class="form-label fw-semibold">Años en la empresa:</label>
                                <input type="number" step="any" min="0" class="form-control" id="aniosServicio" placeholder="Ej. 7" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Calcular Nuevo Sueldo</button>
                            </div>
                        </form>

                        <!-- Área de Resultados -->
                        <div id="resultadoSueldo" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión al archivo JavaScript externo -->
    <script src="../js/ambiguedad_sueldo.js"></script>
</body>
</html>
