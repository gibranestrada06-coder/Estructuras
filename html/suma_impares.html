<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de Números Impares (1 al 100)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5 text-center">
                        <h2 class="mb-4 text-primary fw-bold">Suma de Impares (1 - 100)</h2>
                        <p class="text-muted small mb-4">Haz clic en el botón para calcular automáticamente la suma de todos los números impares comprendidos entre el 1 y el 100 usando un bucle.</p>
                        
                        <!-- Botón de ejecución -->
                        <div class="d-grid mb-4">
                            <button id="btnCalcular" class="btn btn-primary btn-lg rounded-pill">Calcular Suma</button>
                        </div>

                        <!-- Área de Resultados -->
                        <div id="resultadoImpares"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Conexión al archivo JavaScript externo -->
    <script src="../js/suma_impares.js"></script>
</body>
</html>
